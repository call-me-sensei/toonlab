<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M0 0H100V78L78 100H0Z' fill='%23707a94'/%3E%3Ctext x='50' y='72' font-size='64' font-weight='900' font-family='Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif' fill='white' text-anchor='middle'%3E%E5%8F%B0%3C/text%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToonLab — Reference Stage</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #6f7890; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 10; display: flex; gap: 8px;
      font: 13px/1.4 system-ui, sans-serif;
    }
    #hud button {
      padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3);
      background: rgba(30,36,50,0.72); color: #e6ebf2; cursor: pointer; font: inherit;
    }
    #hud button[data-active="true"] { background: #37a05a; border-color: #37a05a; }
    #loading {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center;
      justify-content: center; color: #e6ebf2; background: #6f7890;
      font: 15px/1.4 system-ui, sans-serif;
    }
    #hint {
      position: fixed; bottom: 14px; left: 14px; z-index: 10; color: #dfe4ee;
      font: 12px/1.5 system-ui, sans-serif; background: rgba(30,36,50,0.55);
      padding: 6px 12px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <button id="mode-plain" data-active="true">Studio PBR</button>
    <button id="mode-shader">Our Shader</button>
  </div>
  <div id="hint">Drag orbit · wheel zoom · goal: match the pack showcase before anything enters the world</div>
  <div id="loading">Staging the reference assets…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
