<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M0 0H100V78L78 100H0Z' fill='%2337a05a'/%3E%3Ctext x='50' y='72' font-size='64' font-weight='900' font-family='Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif' fill='white' text-anchor='middle'%3E%E7%BF%A0%3C/text%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToonLab — Verdant World</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1219; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      display: flex; gap: 8px; align-items: center;
      font: 13px/1.4 system-ui, sans-serif;
    }
    #hud button {
      padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25);
      background: rgba(20,26,36,0.72); color: #e6ebf2; cursor: pointer; font: inherit;
    }
    #hud button[data-active="true"] { background: #37a05a; border-color: #37a05a; }
    #hint {
      position: fixed; bottom: 14px; left: 14px; z-index: 10; color: #cfd6df;
      font: 12px/1.5 system-ui, sans-serif; background: rgba(20,26,36,0.6);
      padding: 6px 12px; border-radius: 8px;
    }
    #loading {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center;
      justify-content: center; color: #e6ebf2; background: #0e1219;
      font: 15px/1.4 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="hud">
    <button id="view-explore" data-active="true">1 · Explore</button>
    <button id="view-flyover">2 · Flyover</button>
    <span style="width:10px"></span>
    <button id="tod-day" data-active="true">☀️ Day</button>
    <button id="tod-sunset">🌅 Sunset</button>
    <button id="tod-night">🌙 Night</button>
    <button id="tod-sunrise">🌄 Sunrise</button>
    <button id="tod-cycle" title="Run the full day/night cycle (~2 min)">▶ Cycle</button>
  </div>
  <div id="fps" style="position:fixed;top:14px;right:14px;z-index:10;color:#e6ebf2;font:13px/1.4 ui-monospace,monospace;background:rgba(20,26,36,0.72);padding:6px 12px;border-radius:8px;">— fps</div>
  <div id="hint">WASD/arrows move · drag orbit · wheel zoom · Space jump · 1/2 views</div>
  <div id="loading">Growing the meadow…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
