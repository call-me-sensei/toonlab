<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>ToonLab strict bundle baseline</title>
  <style>
    :root { color-scheme: dark; font: 13px/1.35 Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body, #scene { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #78c8ed; }
    canvas { display: block; width: 100%; height: 100%; }
    #panel { position: fixed; z-index: 10; inset: 14px auto auto 14px; width: 330px; max-height: calc(100% - 28px); overflow: auto; padding: 14px; border: 1px solid rgb(255 255 255 / 22%); border-radius: 12px; background: rgb(20 34 48 / 88%); box-shadow: 0 12px 34px rgb(0 0 0 / 25%); backdrop-filter: blur(12px); }
    h1 { margin: 0 0 3px; font-size: 16px; }
    p { margin: 0 0 11px; color: #9fb5c5; font-size: 11px; }
    .grid { display: grid; grid-template-columns: 82px 1fr; gap: 7px 10px; align-items: center; }
    label { color: #cfe0ec; }
    select { min-width: 0; padding: 5px 7px; border: 1px solid rgb(255 255 255 / 22%); border-radius: 6px; color: #f5fbff; background: #243c50; font: inherit; }
    #domains { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgb(255 255 255 / 16%); }
    .domain { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
    .domain input { accent-color: #66d49e; }
    #status { margin-top: 10px; color: #9fd6b8; white-space: pre-wrap; }
    #status[data-error="true"] { color: #ff9a9a; }
  </style>
</head>
<body>
  <div id="scene"></div>
  <aside id="panel">
    <h1>Strict Bundle Baseline</h1>
    <p>Fresh scene · package defaults · public npm APIs only</p>
    <div class="grid">
      <label for="backend">Backend</label><select id="backend"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2 fallback</option></select>
      <label for="quality">Quality</label><select id="quality"><option value="balanced">Balanced</option><option value="performance">Performance</option></select>
      <label for="view">Review view</label><select id="view"><option value="overview">Overview</option><option value="rocks">480 rocks</option><option value="shadow-rock">Rock shadow receiver</option><option value="shadow-bench">Bench shadow receiver</option><option value="tree-bark">Tree bark fallback</option><option value="shore">Water + foam shadow</option><option value="sky">Sky &amp; clouds</option></select>
      <span>Bundle</span><strong>Call Me Sensei · strict</strong>
      <span>Sky</span><strong>Package default</strong>
      <span>Cloud shadow</span><strong id="cloud-shadow">Starting…</strong>
      <span>Tree bark</span><strong id="tree-bark">Starting…</strong>
      <span>Tree shadow</span><strong id="tree-shadow">Starting…</strong>
      <span>Package</span><strong id="package">—</strong>
    </div>
    <div id="domains" aria-label="Shader domains"></div>
    <div id="status">Starting…</div>
  </aside>
  <script type="module" src="/scene-three.js"></script>
</body>
</html>
